name: Package MyDocx
on:
  push:
    branches: [main, feature/google-drive-macos-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check cloud.js
          node --check dashboard.js
          node --check content.js
          node --check background.js
      - name: Verify extension manifest and assets
        run: node scripts/verify.mjs
      - name: Upload installable extension (single ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: MyDocx-v0.3
          if-no-files-found: error
          compression-level: 9
          path: |
            manifest.json
            background.js
            content.js
            content.css
            dashboard.html
            dashboard.css
            dashboard.js
            cloud.html
            cloud.css
            cloud.js
            SETUP-GOOGLE.md
            README.md
            INSTALLAR.txt
