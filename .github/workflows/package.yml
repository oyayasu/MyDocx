name: Package MyDocx
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check dashboard.js
          node --check content.js
          node --check background.js
      - name: Create extension ZIP
        run: |
          zip -9 MyDocx-extension-v0.1.zip manifest.json background.js content.js content.css dashboard.html dashboard.css dashboard.js README.md
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyDocx-extension-v0.1
          path: MyDocx-extension-v0.1.zip
